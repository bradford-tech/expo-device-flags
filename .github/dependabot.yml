version: 2

updates:
  # Workflows pin actions by commit SHA; Dependabot updates the SHA and the
  # trailing `# vN` comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Don't adopt a release until it has survived a week in the wild. Applies to
    # version updates only, so it never delays a security fix.
    cooldown:
      default-days: 7
    commit-message:
      # `ci:` so release-please does not cut a release for a workflow bump
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # The published package has no runtime dependencies, so everything here is
  # tooling. `chore:` keeps these out of the release-please changelog.
  # The workspace lockfile lives at the repo root; listing only a workspace
  # subdirectory is known to produce PRs that update the manifest without the
  # root package-lock.json (dependabot-core#4993), which then fail `npm ci`.
  # Listing "/" alongside the packages keeps the lockfile in scope. Watch the
  # first PR this opens and confirm package-lock.json is included.
  - package-ecosystem: npm
    directories:
      - /
      - /packages/*
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Pinned by the Expo SDK — bump these as a set with `npx expo install --fix`,
      # in lockstep with example/package.json, not one package at a time.
      #
      # Scoped to `version-update:*` deliberately: a bare `dependency-name` would
      # also suppress security-update PRs for these packages. These conditions
      # match version updates only, so security fixes still open PRs.
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: expo-modules-core
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: babel-preset-expo
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: jest-expo
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # Majors below are gated by packages above, via dependencies the manifest
      # does not express: jest-expo 57 pulls jest 29.x internals, and
      # eslint-config-universe bundles eslint-plugin-react / @typescript-eslint
      # versions that lag eslint and typescript majors — its `eslint: ">=8.10"`
      # peer range does not reflect that. Each of these opened a red PR on the
      # first Dependabot run. Take them deliberately, with the package that
      # gates them; minors and patches still flow into the weekly group.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: jest
        update-types: [version-update:semver-major]
      - dependency-name: "@types/jest"
        update-types: [version-update:semver-major]

  # example/ (inside packages/expo-device-flags) is deliberately omitted: every one of its dependencies is pinned by
  # the Expo SDK, so version updates there would be noise. It is still covered by
  # the dependency graph, which drives security alerts independently of this file.
