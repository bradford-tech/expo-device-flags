on:
  push:
    branches:
      - main

name: release-please

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # All per-path outputs (e.g. "packages/expo-device-flags--tag_name"),
      # serialized so the publish matrix can index into them by path.
      release_outputs: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        path: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) — no NPM_TOKEN needed
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Publish exactly what the release tagged, not main HEAD
          ref: ${{ fromJSON(needs.release-please.outputs.release_outputs)[format('{0}--tag_name', matrix.path)] }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      # prepare scripts build each workspace during install
      - run: npm ci
      - run: npm run lint --workspaces --if-present
      - run: npm test --workspaces --if-present

      - name: Publish (skips private packages)
        env:
          PKG_PATH: ${{ matrix.path }}
        run: |
          if [ "$(node -p "require('./' + process.env.PKG_PATH + '/package.json').private === true")" = "true" ]; then
            echo "Skipping private package $PKG_PATH"
            exit 0
          fi
          npm publish --workspace "./$PKG_PATH" --access public
